<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>项目管理 · 弦歌合唱团</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
:root{--ink-black:#1C1C1C;--ink-gold:#B8860B;--silk-white:#F8F6F0;--border:rgba(28,28,28,0.1);--text-primary:#1C1C1C;--text-muted:#9c9490;--success:#3a7d44;--error:#b03030;--font-mono:'Space Grotesk','Noto Sans SC',sans-serif;--transition:200ms ease;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;font-family:var(--font-mono);font-weight:300;background:var(--silk-white);color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit}
a{color:inherit;text-decoration:none}
.topbar{height:64px;background:var(--ink-black);display:flex;align-items:center;padding:0 2rem;gap:1.5rem;flex-shrink:0}
.brand-name{font-size:0.9rem;color:#B8860B;letter-spacing:0.15em}
.topnav{display:flex;flex:1;gap:0.25rem}
.nav-item{padding:0.5rem 1rem;font-size:0.8rem;color:rgba(255,255,255,0.5);border-radius:4px}
.nav-item.active{color:var(--ink-gold);background:rgba(184,134,11,0.1)}
.user-avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--ink-gold);display:grid;place-items:center;color:var(--ink-gold);cursor:pointer}
.page-body{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:220px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-nav{flex:1;padding:1.5rem 0;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1.25rem;color:#5a5548;font-size:0.85rem;border-left:3px solid transparent}
.sidebar-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75}
.sidebar-item.active{color:var(--ink-gold);background:rgba(184,134,11,0.05);border-left-color:var(--ink-gold)}
.sidebar-user{padding:1rem 1.25rem;border-top:1px solid var(--border)}
.content{flex:1;padding:1.5rem 2rem;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.page-title{font-size:1.5rem;font-weight:300}
.page-subtitle{font-size:0.8rem;color:var(--text-muted);margin-top:0.25rem}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.55rem 1rem;border-radius:4px;font-size:0.8rem;cursor:pointer;border:1px solid transparent}
.btn-gold{background:var(--ink-gold);color:#fff}
.btn-outline{border-color:var(--border);background:#fff;color:#5a5548}
.filter-bar{display:flex;flex-wrap:wrap;gap:0.75rem;margin-bottom:1rem;flex-shrink:0}
.filter-select,.search-input{padding:0.45rem 0.75rem;border:1px solid var(--border);border-radius:4px;font-size:0.8rem;background:#fff}
.search-input{min-width:160px}
.page-title-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.page-title-choir{display:flex;align-items:center;gap:0.5rem;font-size:0.8rem}
.project-layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:1rem;flex:1;min-height:0;align-items:start}
.project-layout.has-detail{align-items:stretch}
.project-layout.has-detail .project-detail-panel{min-height:100%;max-height:calc(100vh - 12rem)}
.project-list-panel{border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column;min-height:0;background:#fff}
.project-list-head{padding:0.75rem 1rem;border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--text-muted)}
#projectList{flex:1;overflow-y:auto;padding:0.5rem}
.project-card{display:block;width:100%;text-align:left;padding:0.75rem;border:1px solid var(--border);border-radius:4px;margin-bottom:0.5rem;background:#fff;cursor:pointer;transition:border-color var(--transition)}
.project-card:hover,.project-card.active{border-color:var(--ink-gold);background:rgba(184,134,11,0.04)}
.project-card-head{display:flex;gap:0.5rem;margin-bottom:0.35rem;font-size:0.7rem}
.project-card-year{color:var(--ink-gold)}
.project-card-type{color:var(--text-muted)}
.project-card-title{font-size:0.9rem;margin-bottom:0.35rem}
.project-card-meta{display:flex;flex-wrap:wrap;gap:0.5rem;font-size:0.7rem;color:var(--text-muted)}
.status-in_progress{color:var(--ink-gold)}
.status-completed{color:var(--success)}
.status-cancelled{color:var(--text-muted)}
.project-detail-panel{border:1px solid var(--border);border-radius:4px;background:#fff;display:flex;flex-direction:column;min-height:0;overflow:hidden;align-self:start}
.project-layout.has-detail .project-detail-panel{align-self:stretch}
.project-detail-empty{margin:0;padding:1rem 1.25rem;text-align:center;color:var(--text-muted);font-size:0.85rem;line-height:1.5}
.detail-scroll{flex:1;overflow-y:auto;padding:1.25rem}
.detail-section{margin-bottom:1.25rem}
.detail-section h3{font-size:0.85rem;font-weight:400;color:var(--ink-gold);margin-bottom:0.5rem;letter-spacing:0.05em}
#detailMeta{display:flex;gap:0.75rem;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.75rem}
#detailTitle{font-size:1.1rem;margin-bottom:0.5rem}
textarea.detail-text{width:100%;min-height:88px;padding:0.65rem;border:1px solid var(--border);border-radius:4px;resize:vertical;line-height:1.5}
.ledger-summary{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:0.75rem;font-size:0.85rem}
.ledger-summary span{padding:0.35rem 0.65rem;background:rgba(237,232,220,0.5);border-radius:4px}
.data-table{width:100%;border-collapse:collapse;font-size:0.8rem}
.data-table th,.data-table td{padding:0.5rem;border-bottom:1px solid var(--border);text-align:left}
.data-table th{font-size:0.7rem;color:var(--text-muted);font-weight:400}
.col-amount{font-variant-numeric:tabular-nums}
.col-muted{color:var(--text-muted);text-align:center;padding:1rem}
.todo-item{display:flex;align-items:flex-start;gap:0.5rem;padding:0.4rem 0;font-size:0.85rem}
.todo-item.done span{text-decoration:line-through;color:var(--text-muted)}
.todo-add-row{display:flex;gap:0.5rem;margin-top:0.5rem}
.link-btn{background:none;border:none;color:var(--ink-gold);cursor:pointer;font-size:0.75rem;padding:0}
.detail-actions{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.empty-hint{text-align:center;color:var(--text-muted);padding:2rem 1rem;font-size:0.85rem}
.material-tabs{display:flex;gap:0.35rem;margin-bottom:0.75rem;flex-wrap:wrap}
.material-tab{padding:0.35rem 0.75rem;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:0.8rem;cursor:pointer}
.material-tab.active{border-color:var(--ink-gold);color:var(--ink-gold);background:rgba(184,134,11,0.06)}
.material-toolbar{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.75rem}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.75rem}
.asset-card{border:1px solid var(--border);border-radius:4px;padding:0.65rem;font-size:0.75rem;background:#fff}
.asset-card-title{font-size:0.8rem;margin-bottom:0.35rem;word-break:break-all}
.asset-card-meta{color:var(--text-muted);margin-bottom:0.35rem}
.asset-card-actions{display:flex;flex-wrap:wrap;gap:0.35rem}
@media(max-width:960px){.project-layout{grid-template-columns:1fr}.sidebar{display:none}}
  </style>
  <script>
    if (location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {
      window.CHOIR_API_BASE = "/api";
      window.CHOIR_UI_BASE = "/ui/";
    }
  </script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-name">弦歌合唱团</span></div>
  <nav class="topnav">
    <a class="nav-item" href="极简中式-桌面端.html">首页</a>
  </nav>
  <div class="user-dropdown" id="userDropdown"><div class="user-avatar" id="userAvatar">—</div></div>
</header>
<div class="page-body">
  <aside class="sidebar">
    <nav class="sidebar-nav">
      <a class="sidebar-item" href="极简中式-桌面端.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>我的首页</a>
      <a class="sidebar-item" href="极简中式-排练计划.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>排练计划</a>
      <a class="sidebar-item" href="极简中式-献唱计划.html"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/></svg>献唱计划</a>
      <a class="sidebar-item" href="极简中式-作业提交.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>作业提交</a>
      <a class="sidebar-item" href="极简中式-成员管理.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>成员管理</a>
      <a class="sidebar-item" href="极简中式-系统管理.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>系统管理</a>
      <a class="sidebar-item" href="极简中式-资料管理.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>资料管理</a>
      <a class="sidebar-item" href="极简中式-录音管理.html"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/></svg>录音管理</a>
      <a class="sidebar-item active" href="极简中式-项目管理.html"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>项目管理</a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-user-name">—</div>
      <div class="sidebar-user-role">—</div>
    </div>
  </aside>
  <main class="content">
    <div class="page-header">
      <div>
        <div class="page-title-row">
          <h1 class="page-title">项目管理</h1>
          <div id="adminChoirWrap" class="page-title-choir" hidden>
            <span>所属团</span>
            <select class="filter-select" id="adminChoirSelect"></select>
          </div>
        </div>
        <p class="page-subtitle">编年纪类型 · 进行中记流水与待办 · 完成后归档摘要与项目资料</p>
      </div>
      <button type="button" class="btn btn-gold" id="btnNewProject" data-perm="projects.write">新建事项</button>
    </div>
    <div class="filter-bar">
      <select class="filter-select" id="filterYear"></select>
      <select class="filter-select" id="filterType"></select>
      <select class="filter-select" id="filterStatus">
        <option value="all">全部状态</option>
        <option value="in_progress">进行中</option>
        <option value="completed">已完成</option>
        <option value="cancelled">已取消</option>
      </select>
      <input type="search" class="search-input" id="searchProject" placeholder="搜索事项名称…"/>
    </div>
    <div class="project-layout">
      <div class="project-list-panel">
        <div class="project-list-head"><span id="projectCount">共 0 项</span></div>
        <div id="projectList"></div>
      </div>
      <div class="project-detail-panel">
        <p class="project-detail-empty" id="projectDetailEmpty">选择左侧事项查看详情</p>
        <div id="projectDetail" hidden class="detail-scroll">
          <h2 id="detailTitle"></h2>
          <div id="detailMeta"></div>
          <section class="detail-section" id="sectionSummaryTop" hidden>
            <h3>完成摘要</h3>
            <textarea class="detail-text" id="detailSummaryTop" style="min-height:160px"></textarea>
            <button type="button" class="btn btn-outline" id="btnSaveSummary" style="margin-top:0.5rem" hidden>保存摘要</button>
          </section>
          <div id="sectionWorking">
          <section class="detail-section">
            <h3>当前进度</h3>
            <textarea class="detail-text" id="detailProgress" placeholder="记录项目当前进展…"></textarea>
            <button type="button" class="btn btn-outline" id="btnSaveProgress" style="margin-top:0.5rem">保存进度</button>
          </section>
          <section class="detail-section">
            <h3>待办</h3>
            <div id="todoList"></div>
            <div class="todo-add-row" id="todoAddRow">
              <button type="button" class="btn btn-outline" id="btnAddTodo">添加待办</button>
            </div>
          </section>
          <section class="detail-section">
            <h3>流水账</h3>
            <div class="ledger-summary">
              <span>收入 <strong id="ledgerIncome">¥0</strong></span>
              <span>支出 <strong id="ledgerExpense">¥0</strong></span>
              <span>结余 <strong id="ledgerBalance">¥0</strong></span>
            </div>
            <button type="button" class="btn btn-outline" id="btnAddTxn" style="margin-bottom:0.5rem">记一笔</button>
            <table class="data-table">
              <thead><tr><th>日期</th><th>方向</th><th>金额</th><th>说明</th><th></th></tr></thead>
              <tbody id="txnBody"></tbody>
            </table>
          </section>
          </div>
          <section class="detail-section" id="sectionMaterials" hidden>
            <h3>项目资料</h3>
            <div class="material-tabs" id="materialTabs">
              <button type="button" class="material-tab active" data-kind="video">影视</button>
              <button type="button" class="material-tab" data-kind="image">图</button>
              <button type="button" class="material-tab" data-kind="text">文</button>
            </div>
            <div class="material-toolbar" id="materialToolbar">
              <button type="button" class="btn btn-outline" id="btnImportAsset">导入</button>
              <button type="button" class="btn btn-outline" id="btnAddVideoUrl" hidden>添加视频链接</button>
              <input type="file" id="assetFileInput" hidden multiple/>
            </div>
            <div class="asset-grid" id="assetGrid"></div>
            <p class="col-muted" id="assetEmpty" hidden>暂无资料，点击「导入」上传</p>
          </section>
          <div class="detail-actions">
            <button type="button" class="btn btn-gold" id="btnComplete">完成项目并生成摘要</button>
            <button type="button" class="btn btn-outline" id="btnDeleteProject" style="color:var(--error)">删除项目</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/permissions.js"></script>
<script src="/js/ui-dialog.js?v=20260530"></script>
<script src="/js/ui-common.js"></script>
<script src="/js/app-shell.js"></script>
<script src="/js/projects-page.js?v=20260602"></script>
</body>
</html>
