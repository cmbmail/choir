<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>系统管理 · 弦歌合唱团</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
:root{--ink-black:#1C1C1C;--ink-gold:#B8860B;--ink-gold-light:#D4A84B;--silk-white:#F8F6F0;--silk-cream:#EDE8DC;--border:rgba(28,28,28,0.1);--border-gold:rgba(184,134,11,0.3);--text-primary:#1C1C1C;--text-secondary:#5a5548;--text-muted:#9c9490;--success:#3a7d44;--warning:#c07a1e;--error:#b03030;--font-mono:'Space Grotesk','Noto Sans SC',sans-serif;--transition:200ms ease;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{height:100vh;font-family:var(--font-mono);font-weight:300;background:var(--silk-white);color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden}
button{cursor:pointer;border:none;background:none;font:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink-gold);outline-offset:2px}
a{color:inherit;text-decoration:none}
*{scrollbar-width:thin;scrollbar-color:var(--ink-gold) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:var(--ink-gold);border-radius:99px}

.topbar{height:64px;background:var(--ink-black);display:flex;align-items:center;padding:0 2rem;gap:1.5rem;flex-shrink:0;border-bottom:1px solid rgba(184,134,11,0.2);position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:0.75rem;flex-shrink:0}
.brand-icon{width:40px;height:40px;border:1px solid var(--ink-gold);display:grid;place-items:center;font-size:1.2rem;color:var(--ink-gold);position:relative}
.brand-icon::before,.brand-icon::after{content:'';position:absolute;width:6px;height:6px}
.brand-icon::before{top:-3px;left:-3px;border-top:1px solid var(--ink-gold);border-left:1px solid var(--ink-gold);}
.brand-icon::after{bottom:-3px;right:-3px;border-bottom:1px solid var(--ink-gold);border-right:1px solid var(--ink-gold);}
.brand-text{display:flex;flex-direction:column}
.brand-name{font-size:0.9rem;font-weight:400;color:var(--ink-gold);letter-spacing:0.15em;text-transform:uppercase}
.brand-sub{font-size:0.6rem;color:rgba(255,255,255,0.35);letter-spacing:0.1em;text-transform:uppercase}
.topnav{display:flex;align-items:center;gap:0.25rem;flex:1}
.nav-item{padding:0.5rem 1rem;font-size:0.8rem;font-weight:400;color:rgba(255,255,255,0.5);border-radius:4px;transition:all var(--transition);display:flex;align-items:center;gap:0.4rem;letter-spacing:0.05em}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{color:#fff}
.nav-item.active{color:var(--ink-gold);background:rgba(184,134,11,0.1)}
.topbar-right{display:flex;align-items:center;gap:0.75rem;margin-left:auto}
.user-dropdown{position:relative}
.user-avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--ink-gold);display:grid;place-items:center;font-size:0.85rem;color:var(--ink-gold);cursor:pointer;transition:all var(--transition)}
.user-avatar:hover{border-color:var(--ink-gold-light)}
.user-dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--silk-white);border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 16px rgba(28,28,28,0.12);min-width:160px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all 0.2s ease;z-index:200}
.user-dropdown.open .user-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:var(--text-primary);cursor:pointer;transition:background var(--transition)}
.dropdown-item:hover{background:rgba(184,134,11,0.06)}
.dropdown-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dropdown-item.danger{color:var(--error)}
.dropdown-divider{height:1px;background:var(--border);margin:4px 0}

.page-body{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:220px;background:var(--silk-white);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;flex-shrink:0}
.sidebar-nav{flex:1;padding:1.5rem 0;overflow-y:auto;min-height:0}
.sidebar-item{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1.25rem;color:var(--text-secondary);font-size:0.85rem;transition:all var(--transition);cursor:pointer;border-left:3px solid transparent;font-weight:300}
.sidebar-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sidebar-item:hover{color:var(--ink-gold);background:rgba(184,134,11,0.03)}
.sidebar-item.active{color:var(--ink-gold);background:rgba(184,134,11,0.05);border-left-color:var(--ink-gold)}
.sidebar-user{padding:1rem 1.25rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:0.75rem;flex-shrink:0;background:var(--silk-white)}
.sidebar-user-top{display:flex;align-items:center;gap:0.75rem}
.sidebar-user-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--ink-black);border:1px solid var(--ink-gold);display:grid;place-items:center;font-size:0.85rem;font-weight:400;color:var(--ink-gold)}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-name{font-size:0.8rem;font-weight:400;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-role{font-size:0.65rem;color:var(--text-muted);margin-top:0.1rem}

.content{flex:1;padding:2rem;overflow-y:auto;min-height:0;max-width:1400px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;gap:1rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.page-title-group{display:flex;flex-direction:column;gap:0.25rem}
.page-title{font-size:1.5rem;font-weight:300;color:var(--ink-black);letter-spacing:0.05em}
.page-subtitle{font-size:0.8rem;color:var(--text-muted);letter-spacing:0.05em}
.page-actions{display:flex;gap:0.75rem;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.625rem 1.125rem;border-radius:4px;font-size:0.8rem;font-weight:400;transition:all var(--transition);cursor:pointer;border:1px solid transparent;letter-spacing:0.03em}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--ink-black);color:var(--silk-white);border-color:var(--ink-black)}
.btn-gold{background:var(--ink-gold);color:#fff;box-shadow:0 4px 12px rgba(184,134,11,0.25)}
.btn-gold:hover{background:var(--ink-gold-light)}
.btn-outline{border-color:var(--border);color:var(--text-secondary);background:var(--silk-white)}
.btn-outline:hover{border-color:var(--ink-gold);color:var(--ink-gold)}

.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:1px solid var(--border)}
.tab{padding:0.75rem 1.5rem;font-size:0.85rem;color:var(--text-muted);cursor:pointer;transition:all var(--transition);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--ink-gold);border-bottom-color:var(--ink-gold)}

.card{background:var(--silk-white);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:1.5rem}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border);background:rgba(237,232,220,0.2)}
.card-title{font-size:0.85rem;font-weight:400;color:var(--ink-black);display:flex;align-items:center;gap:0.5rem}
.card-title svg{width:14px;height:14px;stroke:var(--ink-gold);fill:none;stroke-width:2}
.card-actions{display:flex;gap:0.5rem}
.card-body{padding:1.25rem}

.user-table{width:100%;border-collapse:collapse}
.user-table th{text-align:left;font-size:0.6rem;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-gold);padding:0.625rem 1rem;border-bottom:1px solid var(--border);white-space:nowrap;background:rgba(237,232,220,0.3)}
.user-table td{padding:0.875rem 1rem;border-bottom:1px solid rgba(28,28,28,0.06);font-size:0.85rem;vertical-align:middle;font-weight:300}
.user-table tr:last-child td{border-bottom:none}
.user-table tbody tr{transition:background var(--transition)}
.user-table tbody tr:hover{background:rgba(184,134,11,0.04)}

.u-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:0.75rem;border:1px solid var(--border-gold)}
.u-name{font-weight:400;color:var(--text-primary)}
.u-role{font-size:0.7rem;color:var(--text-muted)}
.role-badge{display:inline-flex;padding:0.2rem 0.5rem;border-radius:3px;font-size:0.7rem;font-weight:400}
.role-admin{background:rgba(184,134,11,0.1);color:var(--ink-gold)}
.role-user{background:rgba(28,28,28,0.06);color:var(--text-secondary)}
.status-badge{display:inline-flex;align-items:center;gap:0.375rem;padding:0.2rem 0.5rem;border-radius:3px;font-size:0.7rem;font-weight:400}
.badge-active{background:rgba(58,125,68,0.1);color:var(--success)}
.badge-inactive{background:rgba(28,28,28,0.06);color:var(--text-muted)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.action-btn{padding:0.375rem 0.625rem;font-size:0.7rem;border:1px solid var(--border);border-radius:3px;background:var(--silk-white);color:var(--text-secondary);cursor:pointer;transition:all var(--transition)}
.action-btn:hover{border-color:var(--ink-gold);color:var(--ink-gold)}
.action-btn.danger:hover{border-color:var(--error);color:var(--error)}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-box{background:var(--silk-white);border:1px solid var(--border);border-radius:4px;padding:1rem;text-align:center}
.stat-value{font-size:1.5rem;font-weight:400;color:var(--ink-black);margin-bottom:0.25rem}
.stat-label{font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em}

.log-list{list-style:none}
.log-item{display:flex;align-items:flex-start;gap:1rem;padding:0.875rem 0;border-bottom:1px solid rgba(28,28,28,0.06)}
.log-item:last-child{border-bottom:none}
.log-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.log-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.log-icon-create{background:rgba(58,125,68,0.1);color:var(--success)}
.log-icon-update{background:rgba(59,130,246,0.1);color:#3b82f6}
.log-icon-delete{background:rgba(176,48,48,0.1);color:var(--error)}
.log-icon-login{background:rgba(184,134,11,0.1);color:var(--ink-gold)}
.log-content{flex:1}
.log-text{font-size:0.85rem;color:var(--text-primary);margin-bottom:0.25rem}
.log-text strong{font-weight:400}
.log-time{font-size:0.7rem;color:var(--text-muted)}

.footer{background:var(--silk-white);border-top:1px solid var(--border);padding:1.5rem 2rem;text-align:center;flex-shrink:0}
.footer-text{font-size:0.7rem;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase}

@media(max-width:1200px){.sidebar{display:none}.page-body{flex-direction:column}.stats-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.topbar{padding:0 1rem}.content{padding:1rem}.tabs{overflow-x:auto}.stat-row{grid-template-columns:1fr}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:500;padding:1rem}
.modal-overlay.open{display:flex}
.modal-box{background:var(--silk-white);border:1px solid var(--border);border-radius:4px;padding:1.5rem;width:min(440px,100%)}
.modal-box h2{font-size:1.1rem;font-weight:400;margin-bottom:1rem}
.modal-box label{display:block;font-size:0.8rem;margin:0.5rem 0 0.25rem;color:var(--text-secondary)}
.modal-box input{width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:4px;margin-bottom:0.5rem}
.modal-actions{display:flex;gap:0.5rem;margin-top:1rem;justify-content:flex-end}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--ink-black);color:#fff;padding:0.65rem 1.25rem;border-radius:4px;font-size:0.85rem;z-index:800}
.toast.toast-err{background:var(--error)}
  </style>

    if (location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {

  </script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">♪</div>
    <div class="brand-text">
      <span class="brand-name">极简中式</span>
      <span class="brand-sub">Choir Management</span>
    </div>
  </div>
  <nav class="topnav">
    <a class="nav-item" href="极简中式-桌面端.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>首页</a>
    <a class="nav-item" href="极简中式-系统管理.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>系统管理</a>
  </nav>
  <div class="topbar-right">
    <div class="user-dropdown" id="userDropdown">
      <div class="user-avatar" title="刘">刘</div>
      <div class="user-dropdown-menu">
        <div class="dropdown-item" data-change-password><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>修改密码</span></div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item danger" data-logout><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>退出登录</span></div>
      </div>
    </div>
  </div>
</header>

<div class="page-body">
  <aside class="sidebar">
    <nav class="sidebar-nav">
      <a class="sidebar-item" href="极简中式-桌面端.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>我的首页</a>
      <a class="sidebar-item" href="极简中式-排练计划.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/></svg>排练计划</a>
      <a class="sidebar-item" href="极简中式-献唱计划.html"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>献唱计划</a>
      <a class="sidebar-item" href="极简中式-作业提交.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>作业提交</a>
      <a class="sidebar-item" href="极简中式-成员管理.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>成员管理</a>
      <a class="sidebar-item active" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>系统管理</a>
      <a class="sidebar-item" href="极简中式-资料管理.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>资料管理</a>
      <a class="sidebar-item" href="极简中式-录音管理.html"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>录音管理</a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-user-top">
        <div class="sidebar-user-avatar">刘</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">刘管理员</div>
          <div class="sidebar-user-role">系统管理员</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="page-header">
      <div class="page-title-group">
        <h1 class="page-title">系统管理</h1>
        <p class="page-subtitle">合唱团创建与管理（系统超管）</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-outline" id="btn-refresh-choirs">刷新</button>
        <button type="button" class="btn btn-gold" id="btn-add-choir">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建合唱团
        </button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-value" id="stat-choirs">—</div>
        <div class="stat-label">合唱团总数</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-active">—</div>
        <div class="stat-label">运营中</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>

    </div>

    <div class="card" id="logs-placeholder">
      <div class="card-header">
        <span class="card-title">操作日志</span>
      </div>
      <div class="card-body" id="logs-list" style="padding:0 1.25rem 1.25rem">
        <p style="color:var(--text-muted);padding:0.5rem 0">加载中…</p>
      </div>
    </div>
  </main>
</div>


<div id="toast" class="toast" hidden></div>
<div id="modal-create-choir" class="modal-overlay">

    <form id="form-create-choir">
      <label for="new-choir-name">团名</label>
      <input id="new-choir-name" required maxlength="64" placeholder="例如：弦歌合唱团"/>

        <button type="submit" class="btn btn-gold">创建</button>

    </form>

</div>
