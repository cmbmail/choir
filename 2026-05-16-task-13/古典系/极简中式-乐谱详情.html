<html lang="zh-CN">
<head>

  <style>
:root{--ink-black:#1C1C1C;--ink-gold:#B8860B;--ink-gold-light:#D4A84B;--silk-white:#F8F6F0;--silk-cream:#EDE8DC;--border:rgba(28,28,28,0.1);--border-gold:rgba(184,134,11,0.3);--text-primary:#1C1C1C;--text-secondary:#5a5548;--text-muted:#9c9490;--success:#3a7d44;--warning:#c07a1e;--error:#b03030;--font-mono:'Space Grotesk','Noto Sans SC',sans-serif;--transition:200ms ease;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{height:100vh;font-family:var(--font-mono);font-weight:300;background:var(--silk-white);color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden}
button{cursor:pointer;border:none;background:none;font:inherit;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ink-gold);outline-offset:2px}
a{color:inherit;text-decoration:none}
*{scrollbar-width:thin;scrollbar-color:var(--ink-gold) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:var(--ink-gold);border-radius:99px}

/* === TOPBAR (same as other pages) === */
.topbar{height:64px;background:var(--ink-black);display:flex;align-items:center;padding:0 2rem;gap:1.5rem;flex-shrink:0;border-bottom:1px solid rgba(184,134,11,0.2);position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:0.75rem;flex-shrink:0}
.brand-icon{width:40px;height:40px;border:1px solid var(--ink-gold);display:grid;place-items:center;font-size:1.2rem;color:var(--ink-gold);position:relative}
.brand-icon::before,.brand-icon::after{content:'';position:absolute;width:6px;height:6px}
.brand-icon::before{top:-3px;left:-3px;border-top:1px solid var(--ink-gold);border-left:1px solid var(--ink-gold)}
.brand-icon::after{bottom:-3px;right:-3px;border-bottom:1px solid var(--ink-gold);border-right:1px solid var(--ink-gold)}
.brand-text{display:flex;flex-direction:column}
.brand-name{font-size:0.9rem;font-weight:400;color:var(--ink-gold);letter-spacing:0.15em;text-transform:uppercase}
.brand-sub{font-size:0.6rem;color:rgba(255,255,255,0.35);letter-spacing:0.1em;text-transform:uppercase}
.topnav{display:flex;align-items:center;gap:0.25rem;flex:1}
.nav-item{padding:0.5rem 1rem;font-size:0.8rem;font-weight:400;color:rgba(255,255,255,0.5);border-radius:4px;transition:all var(--transition);display:flex;align-items:center;gap:0.4rem;letter-spacing:0.05em}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{color:#fff}
.nav-item.active{color:var(--ink-gold);background:rgba(184,134,11,0.1)}
.topbar-right{display:flex;align-items:center;gap:0.75rem;margin-left:auto}
.user-dropdown{position:relative}
.user-avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--ink-gold);display:grid;place-items:center;font-size:0.85rem;color:var(--ink-gold);cursor:pointer;transition:all var(--transition)}
.user-dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--silk-white);border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 16px rgba(28,28,28,0.12);min-width:160px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all 0.2s ease;z-index:200}
.user-dropdown.open .user-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:var(--text-primary);cursor:pointer;transition:background var(--transition)}
.dropdown-item:hover{background:rgba(184,134,11,0.06)}
.dropdown-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dropdown-item.danger{color:var(--error)}
.dropdown-divider{height:1px;background:var(--border);margin:4px 0}

/* === PAGE BODY === */
.page-body{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:220px;background:var(--silk-white);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;flex-shrink:0}
.sidebar-nav{flex:1;padding:1.5rem 0;overflow-y:auto;min-height:0}
.sidebar-item{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1.25rem;color:var(--text-secondary);font-size:0.85rem;transition:all var(--transition);cursor:pointer;border-left:3px solid transparent;font-weight:300}
.sidebar-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sidebar-item:hover{color:var(--ink-gold);background:rgba(184,134,11,0.03)}
.sidebar-item.active{color:var(--ink-gold);background:rgba(184,134,11,0.05);border-left-color:var(--ink-gold)}
.sidebar-user{padding:1rem 1.25rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:0.75rem;flex-shrink:0;background:var(--silk-white)}
.sidebar-user-top{display:flex;align-items:center;gap:0.75rem}
.sidebar-user-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--ink-black);border:1px solid var(--ink-gold);display:grid;place-items:center;font-size:0.85rem;font-weight:400;color:var(--ink-gold)}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-name{font-size:0.8rem;font-weight:400;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-role{font-size:0.65rem;color:var(--text-muted);margin-top:0.1rem}

/* === CONTENT === */
.content{flex:1;padding:1.5rem 2rem;overflow-y:auto;min-height:0}

/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:var(--text-muted);margin-bottom:1.25rem}
.breadcrumb a{color:var(--text-secondary);transition:color var(--transition)}
.breadcrumb a:hover{color:var(--ink-gold)}
.breadcrumb .sep{color:var(--border-gold)}
.breadcrumb .current{color:var(--ink-gold);font-weight:400}

/* Detail Layout */
.detail-layout{display:grid;grid-template-columns:1fr 380px;gap:1.5rem}
@media(max-width:1200px){.detail-layout{grid-template-columns:1fr}}

/* === SCORE VIEWER (left column) === */
.score-viewer{background:var(--silk-white);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.score-viewer-header{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;border-bottom:1px solid var(--border);background:rgba(237,232,220,0.3)}
.score-viewer-title{font-size:0.85rem;font-weight:400;color:var(--ink-black);display:flex;align-items:center;gap:0.5rem}
.score-viewer-title svg{width:14px;height:14px;stroke:var(--ink-gold);fill:none;stroke-width:2}
.score-viewer-actions{display:flex;gap:0.5rem}
.score-page{height:70vh;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.score-page-placeholder{text-align:center;color:var(--text-muted)}
.score-page-placeholder svg{width:64px;height:64px;stroke:var(--border-gold);fill:none;stroke-width:1;margin-bottom:1rem}
.score-page-placeholder p{font-size:0.85rem;margin-top:0.5rem}
.score-page-placeholder .hint{font-size:0.7rem;color:var(--text-muted);margin-top:0.25rem}
.score-page-nav{display:flex;align-items:center;justify-content:center;gap:1rem;padding:0.5rem;background:var(--silk-white);border-top:1px solid var(--border)}
.score-page-nav button{background:none;border:1px solid var(--border);border-radius:3px;padding:0.3rem 0.75rem;font-size:0.75rem;color:var(--text-secondary);cursor:pointer;transition:all var(--transition)}
.score-page-nav button:hover{border-color:var(--ink-gold);color:var(--ink-gold)}
.score-page-nav .page-info{font-size:0.75rem;color:var(--text-muted)}

/* === RIGHT PANEL === */
.detail-panel{display:flex;flex-direction:column;gap:1rem}

/* Info Card */
.info-card{background:var(--silk-white);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.info-card-header{padding:0.75rem 1rem;border-bottom:1px solid var(--border);font-size:0.8rem;font-weight:400;color:var(--ink-black);display:flex;align-items:center;gap:0.5rem;background:rgba(237,232,220,0.2)}
.info-card-header svg{width:14px;height:14px;stroke:var(--ink-gold);fill:none;stroke-width:2}
.info-card-body{padding:1rem}

/* Meta grid */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem 1rem}
.meta-item{display:flex;flex-direction:column;gap:0.15rem}
.meta-label{font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em}
.meta-value{font-size:0.8rem;color:var(--text-primary);font-weight:400}

/* Tag row */
.tag-row{display:flex;gap:0.375rem;flex-wrap:wrap;margin-top:0.5rem}
.detail-tag{display:inline-flex;padding:0.15rem 0.5rem;border-radius:2px;font-size:0.65rem;font-weight:400}
.tag-cat{background:rgba(184,134,11,0.1);color:var(--ink-gold)}
.tag-style{background:rgba(58,125,68,0.1);color:var(--success)}
.tag-coll{background:rgba(59,130,246,0.1);color:#3b82f6}

/* Download button */
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.625rem 1.125rem;border-radius:4px;font-size:0.8rem;font-weight:400;transition:all var(--transition);cursor:pointer;border:1px solid transparent;letter-spacing:0.03em}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-gold{background:var(--ink-gold);color:#fff;box-shadow:0 4px 12px rgba(184,134,11,0.25)}
.btn-gold:hover{background:var(--ink-gold-light)}
.btn-outline{border-color:var(--border);color:var(--text-secondary);background:var(--silk-white)}
.btn-outline:hover{border-color:var(--ink-gold);color:var(--ink-gold)}
.btn-block{width:100%;justify-content:center;margin-top:0.75rem}

/* Audio List */
.audio-list{display:flex;flex-direction:column;gap:0.5rem}
.audio-item{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0.75rem;border:1px solid var(--border);border-radius:4px;transition:all var(--transition)}
.audio-item:hover{border-color:var(--ink-gold)}
.audio-icon{width:32px;height:32px;border-radius:4px;background:rgba(184,134,11,0.08);display:grid;place-items:center;flex-shrink:0}
.audio-icon svg{width:16px;height:16px;stroke:var(--ink-gold);fill:none;stroke-width:1.75}
.audio-info{flex:1;min-width:0}
.audio-name{font-size:0.8rem;font-weight:400;color:var(--text-primary)}
.audio-dur{font-size:0.65rem;color:var(--text-muted)}
.audio-play-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-gold);display:grid;place-items:center;cursor:pointer;transition:all var(--transition);background:var(--silk-white);flex-shrink:0}
.audio-play-btn:hover{background:var(--ink-gold);border-color:var(--ink-gold)}
.audio-play-btn:hover svg{stroke:#fff}
.audio-play-btn svg{width:12px;height:12px;stroke:var(--ink-gold);fill:none;stroke-width:2}
.audio-dl-btn{font-size:0.65rem;padding:0.2rem 0.5rem;border:1px solid var(--border);border-radius:2px;color:var(--text-secondary);cursor:pointer;transition:all var(--transition);background:var(--silk-white);flex-shrink:0}
.audio-dl-btn:hover{border-color:var(--ink-gold);color:var(--ink-gold)}

/* Demo Audio Player */
.demo-player{background:var(--silk-cream);border:1px solid var(--border);border-radius:4px;padding:0.75rem 1rem;display:flex;align-items:center;gap:0.75rem}
.demo-play-btn{width:36px;height:36px;border-radius:50%;background:var(--ink-gold);border:none;display:grid;place-items:center;cursor:pointer;transition:all var(--transition);flex-shrink:0}
.demo-play-btn:hover{background:var(--ink-gold-light)}
.demo-play-btn svg{width:16px;height:16px;fill:#fff;stroke:none}
.demo-track-info{flex:1;min-width:0}
.demo-track-name{font-size:0.8rem;font-weight:400;color:var(--text-primary)}
.demo-track-sub{font-size:0.65rem;color:var(--text-muted);margin-top:0.1rem}
.demo-progress{flex:1;height:3px;background:rgba(28,28,28,0.1);border-radius:99px;position:relative;cursor:pointer}
.demo-progress-bar{height:100%;width:35%;background:var(--ink-gold);border-radius:99px;transition:width 0.1s}
.demo-time{font-size:0.65rem;color:var(--text-muted);flex-shrink:0;font-variant-numeric:tabular-nums}

/* Video */
.video-embed{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border:1px solid var(--border);border-radius:4px;background:#000}
.video-embed .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-muted)}
.video-embed .placeholder svg{width:48px;height:48px;stroke:var(--border-gold);fill:none;stroke-width:1}
.video-embed .placeholder p{position:absolute;bottom:1rem;font-size:0.7rem;color:var(--text-muted)}

/* Intro (rich text) */
.intro-text{font-size:0.82rem;line-height:1.9;color:var(--text-secondary)}
.intro-text p{margin-bottom:0.75rem}
.intro-text img{max-width:100%;border-radius:4px;border:1px solid var(--border);margin:0.5rem 0}
.intro-text strong{color:var(--text-primary);font-weight:400}
.intro-text em{color:var(--ink-gold);font-style:normal;font-size:0.75rem}

/* Score intro section (below viewer) */
.score-intro-section{padding:1.25rem 1rem;border-top:1px solid var(--border)}
.score-intro-title{display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;font-weight:400;color:var(--ink-black);margin-bottom:0.875rem}
.score-intro-title svg{width:14px;height:14px;stroke:var(--ink-gold);fill:none;stroke-width:2}

/* Related */
.related-list{display:flex;flex-direction:column;gap:0.5rem}
.related-item{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0.75rem;border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all var(--transition)}
.related-item:hover{border-color:var(--ink-gold);background:rgba(184,134,11,0.03)}
.related-thumb{width:40px;height:40px;border-radius:3px;background:rgba(237,232,220,0.5);display:grid;place-items:center;flex-shrink:0}
.related-thumb svg{width:18px;height:18px;stroke:var(--ink-gold);fill:none;stroke-width:1.5}
.related-info{flex:1;min-width:0}
.related-name{font-size:0.8rem;font-weight:400;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.related-meta{font-size:0.65rem;color:var(--text-muted);margin-top:0.1rem}
.info-card-header{display:flex;align-items:center;justify-content:space-between}
.card-actions{display:flex;gap:0.35rem;flex-wrap:wrap}
.btn-mini{font-size:0.65rem;padding:0.2rem 0.55rem;border:1px solid var(--border);border-radius:3px;color:var(--text-secondary);background:var(--silk-white);cursor:pointer}
.btn-mini:hover{border-color:var(--ink-gold);color:var(--ink-gold)}
.card-actions .btn-mini{font-size:0.65rem;padding:0.2rem 0.55rem;border:1px solid var(--border);border-radius:3px;color:var(--text-secondary);background:var(--silk-white)}
.card-actions .btn-mini:hover{border-color:var(--ink-gold);color:var(--ink-gold)}
.card-actions .btn-mini.danger{color:var(--error);border-color:rgba(176,48,48,0.35)}
.section-empty{font-size:0.75rem;color:var(--text-muted);padding:0.25rem 0}
.score-page--clickable{cursor:pointer;position:relative}
.score-preview-frame{width:100%;height:min(70vh,720px);border:0;background:#fff;display:block}
.score-preview-img{max-width:100%;max-height:min(70vh,720px);object-fit:contain;margin:0 auto}
.score-expand-hint{position:absolute;bottom:0.75rem;right:0.75rem;font-size:0.65rem;color:#fff;background:rgba(28,28,28,0.55);padding:0.25rem 0.6rem;border-radius:3px;pointer-events:none}
#scoreExpandModal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:3000;display:flex;align-items:center;justify-content:center;padding:1rem}
#scoreExpandModal[hidden]{display:none!important}
#scoreExpandBody{width:100%;max-width:1100px}
#btnScoreExpandClose{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:1.5rem;width:40px;height:40px;border-radius:50%;cursor:pointer}
.demo-audio-stack{display:flex;flex-direction:column;gap:0.5rem}
  </style>

</head>
