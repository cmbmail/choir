<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 — 弦歌合唱团</title>
  <link rel="stylesheet" href="css/theme.css" />
  <script>
  if (location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {
      window.CHOIR_API_BASE = "/api";
      window.CHOIR_UI_BASE = "/ui/";
    }
  </script>
</head>
<body>
  <div class="auth-card">
    <h1>邀请码注册</h1>
    <p class="sub">注册后为团员权限，管理角色由超管分配</p>
    <form id="reg-form">
      <label for="choir_slug">合唱团 slug</label>
      <input id="choir_slug" required />
      <label for="invite_code">邀请码（8 位）</label>
      <input id="invite_code" required maxlength="8" />
      <label for="username">手机号</label>
      <input id="username" type="text" inputmode="numeric" required />
      <label for="name">真实姓名</label>
      <input id="name" required />
      <label for="voice_part">声部（1–8，可选）</label>
      <input id="voice_part" type="number" min="1" max="8" />
      <label for="password">密码</label>
      <input id="password" type="password" required />
      <button type="submit">注册</button>
      <p class="msg" id="msg"></p>
    </form>
    <p class="links"><a href="login.html">已有账号登录</a></p>
  </div>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("choir")) document.getElementById("choir_slug").value = params.get("choir");
    if (params.get("code")) document.getElementById("invite_code").value = params.get("code");

    document.getElementById("reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      const vp = document.getElementById("voice_part").value;
      const body = {
        choir_slug: document.getElementById("choir_slug").value.trim(),
        invite_code: document.getElementById("invite_code").value.trim(),
        username: document.getElementById("username").value.trim(),
        name: document.getElementById("name").value.trim(),
        password: document.getElementById("password").value,
      };
      if (vp) body.voice_part = parseInt(vp, 10);
      try {
        await ChoirAPI.post("/auth/register", body);
        msg.style.color = "#8c8";
        msg.textContent = "注册成功，请登录";
        setTimeout(() => { location.href = "login.html"; }, 800);
      } catch (err) {
        msg.style.color = "";
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
