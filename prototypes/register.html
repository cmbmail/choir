<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 — 雅歌</title>
  <link rel="stylesheet" href="css/theme.css" />
  <script>
  if (location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {
      window.CHOIR_API_BASE = "/api";
      window.CHOIR_UI_BASE = "/ui/";
    }
  </script>
</head>
<body>
  <div class="auth-card">
    <h1>邀请码注册</h1>
    <p class="sub" id="welcome-sub">请输入邀请码，验证后将显示团队名称</p>
    <form id="reg-form">
      <label for="invite_code">邀请码（8 位）</label>
      <input id="invite_code" required maxlength="8" autocomplete="off" />
      <label for="username">手机号</label>
      <input id="username" type="text" inputmode="numeric" required autocomplete="tel" />
      <label for="name">真实姓名</label>
      <input id="name" required autocomplete="name" />
      <label for="password">密码</label>
      <input id="password" type="password" required autocomplete="new-password" />
      <button type="submit" id="submit-btn">注册</button>
      <p class="msg" id="msg"></p>
    </form>
    <p class="links"><a href="login.html">已有账号登录</a></p>
  </div>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const inviteInput = document.getElementById("invite_code");
    const welcomeSub = document.getElementById("welcome-sub");
    const submitBtn = document.getElementById("submit-btn");
    let previewTimer = null;
    let choirName = null;

    if (params.get("code")) inviteInput.value = params.get("code");

    function setWelcomePending() {
      choirName = null;
      welcomeSub.textContent = "请输入邀请码，验证后将显示团队名称";
      welcomeSub.classList.remove("welcome-ready");
      submitBtn.disabled = false;
    }

    function setWelcomeReady(name) {
      choirName = name;
      welcomeSub.textContent = `欢迎您加入「${name}」`;
      welcomeSub.classList.add("welcome-ready");
    }

    async function previewInvite() {
      const code = inviteInput.value.trim();
      if (code.length < 8) {
        setWelcomePending();
        return;
      }
      try {
        const data = await ChoirAPI.get(`/auth/invite-preview?code=${encodeURIComponent(code)}`);
        setWelcomeReady(data.choir_name);
      } catch {
        choirName = null;
        welcomeSub.textContent = "邀请码无效或已过期，请核对后重试";
        welcomeSub.classList.remove("welcome-ready");
      }
    }

    inviteInput.addEventListener("input", () => {
      clearTimeout(previewTimer);
      if (inviteInput.value.trim().length < 8) {
        setWelcomePending();
        return;
      }
      previewTimer = setTimeout(previewInvite, 400);
    });

    if (inviteInput.value.trim().length === 8) previewInvite();

    document.getElementById("reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      const code = inviteInput.value.trim();
      if (code.length !== 8) {
        msg.textContent = "请输入 8 位邀请码";
        return;
      }
      if (!choirName) await previewInvite();
      if (!choirName) {
        msg.textContent = "邀请码无效或已过期";
        return;
      }
      const body = {
        invite_code: code,
        username: document.getElementById("username").value.trim(),
        name: document.getElementById("name").value.trim(),
        password: document.getElementById("password").value,
      };
      submitBtn.disabled = true;
      try {
        await ChoirAPI.post("/auth/register", body);
        msg.style.color = "#8c8";
        msg.textContent = "注册成功，请登录";
        setTimeout(() => { location.href = "login.html"; }, 800);
      } catch (err) {
        msg.style.color = "";
        msg.textContent = err.message;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
