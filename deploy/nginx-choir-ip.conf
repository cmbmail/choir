# /etc/nginx/conf.d/choir.conf — 仅 IP 访问（47.98.105.70），无 TLS
# 正式环境请改用 nginx-choir.conf + 域名 + HTTPS

upstream choir_api {
    server 127.0.0.1:5000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.98.105.70 _;

    client_max_body_size 64m;

    # 静态资源：root 已是 prototypes，JS/CSS 用 /js/；兼容旧路径 /prototypes/
    location /prototypes/ {
        alias /opt/choir/prototypes/;
    }

    location / {
        root /opt/choir/prototypes;
        index login.html;
        try_files $uri $uri/ /login.html;
    }

    location /ui/ {
        alias /opt/choir/2026-05-16-task-13/古典系/;
    }

    location /api/ {
        proxy_pass http://choir_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://choir_api/health;
    }
}
